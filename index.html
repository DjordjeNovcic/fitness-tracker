<!DOCTYPE html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5f75" />
    <meta name="description" content="Licna PWA aplikacija za plan obroka, kalorije i trening." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fit Tracker" />
    <title>Fit Tracker</title>
    <script>
      // Resolve theme to an explicit data-theme before first paint (no flash of wrong theme).
      (function () {
        var root = document.documentElement;
        var mql = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
        function resolve(pref) {
          return pref === "dark" || (pref !== "light" && mql && mql.matches) ? "dark" : "light";
        }
        function apply(pref) {
          var mode = resolve(pref);
          root.dataset.theme = mode;
          root.style.colorScheme = mode;
          root.setAttribute("data-theme-pref", pref || "auto");
          // Browser chrome / iOS status bar follows the app theme, not a fixed green.
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode === "dark" ? "#0d0c0a" : "#1f5f75");
        }
        var stored;
        try { stored = localStorage.getItem("ft-theme"); } catch (e) {}
        apply(stored || "auto");
        if (mql) {
          try {
            mql.addEventListener("change", function () {
              var p; try { p = localStorage.getItem("ft-theme"); } catch (e) {}
              if (!p || p === "auto") apply("auto");
            });
          } catch (e) {}
        }
        // Delegated so it keeps working across the app's full re-renders.
        document.addEventListener("click", function (event) {
          var trigger = event.target.closest && event.target.closest('[data-action="toggle-theme"]');
          if (!trigger) return;
          var next = root.dataset.theme === "dark" ? "light" : "dark";
          try { localStorage.setItem("ft-theme", next); } catch (e) {}
          apply(next);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts load without blocking first paint (system fallbacks show first,
         display=swap swaps them in); the noscript copy keeps them for no-JS. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <!-- app.js imports these statically; preloading lets them download alongside
         app.js instead of after it has been parsed (one fewer round trip on a cold start). -->
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js" crossorigin />
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.10.0/firebase-firestore.js" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="alternate icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Static skeleton so something paints before app.js + Firebase (~1 MB) arrive;
         app.js replaces it on its first render. Mirrors renderLoadingShell(). -->
    <div id="app">
      <main class="shell app-main loading-shell" aria-busy="true" aria-label="Učitavanje">
        <div class="skeleton skeleton-hero"></div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-line skeleton-line--title"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line skeleton-line--short"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-line skeleton-line--title"></div>
          <div class="skeleton skeleton-line"></div>
        </div>
        <p class="loading-shell-note">Povezujem aplikaciju…</p>
      </main>
    </div>
    <script src="./data/seed-data.js"></script>
    <script src="./app.js" type="module"></script>
  </body>
  </html>
